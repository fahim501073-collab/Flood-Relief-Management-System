<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Relief Management System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Flood Relief Management System</h1>
        <p>Algorithm Based Relief Management Dashboard</p>
    </header>

    <main>
        <section class="status-card">
            <h2>System Status</h2>
            <p id="status">Checking server...</p>
        </section>

        <section class="card">
            <h2>Flood Affected Areas</h2>
            <button onclick="loadAreas()">Load Areas</button>
            <div id="areas"></div>
        </section>

        <section class="card">
            <h2>Area Priority</h2>
            <button onclick="loadPriority()">Calculate Priority</button>
            <div id="priority"></div>
        </section>

        <section class="card">
            <h2>Shortest Route</h2>
            <label for="source">Starting Area ID</label>
            <input type="number" id="source" value="0" min="0">
            <button onclick="findRoute()">Find Shortest Routes</button>
            <div id="routes"></div>
        </section>

        <section class="card">
            <h2>Activity Selection</h2>
            <button onclick="selectReliefActivities()">Select Activities</button>
            <div id="activities"></div>
        </section>

        <section class="card">
            <h2>Fractional Knapsack</h2>
            <button onclick="calculateFractional()">Calculate</button>
            <div id="fractional"></div>
        </section>

        <section class="card">
            <h2>0/1 Knapsack</h2>
            <button onclick="calculateKnapsack()">Calculate</button>
            <div id="knapsack"></div>
        </section>

        <section class="card">
            <h2>Coin Change</h2>
            <button onclick="calculateCoins()">Calculate</button>
            <div id="coins"></div>
        </section>
    </main>

    <footer>
        <p>Flood Relief Management System | CSE Project</p>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
